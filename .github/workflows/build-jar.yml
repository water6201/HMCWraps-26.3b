name: Build plugin jar (26.3 / Folia)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: HMCWraps-jar
          path: build/libs/HMCWraps-*.jar
